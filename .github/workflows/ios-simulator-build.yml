name: iOS Simulator Build

on:
  push:
    branches:
      - fuhahh-try
  pull_request:
    branches:
      - fuhahh-try

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS Simulator target
        run: |
          xcodebuild \
            -project AvocadoToast.xcodeproj \
            -target AvocadoToast \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
